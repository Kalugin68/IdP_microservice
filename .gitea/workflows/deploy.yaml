name: Deploy Service

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
          -t 127.0.0.1:5000/idp:latest \
          ./app

      - name: Push Docker image
        run: docker push 127.0.0.1:5000/idp:latest

  deploy:
    needs: build

    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Create .env
        run: |
          cat > .env << EOF
          JWT_PRIVATE=${{ secrets.JWT_PRIVATE }}
          JWT_PUBLIC=${{ secrets.JWT_PUBLIC }}
          JWT_ALGORITHM=EdDSA
          
          DB_NAME=identity_provider
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          DB_DSN=postgresql+asyncpg://postgres:${{ secrets.DB_PASSWORD }}@postgres:5432/identity_provider
          EOF

      - name: Deploy
        shell: powershell
        run: docker compose up -d
